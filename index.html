<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mera Bazaar</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;
      background:#f5f5f5;
    }

    header{
      background:#0b8f55;
      color:white;
      padding:20px;
      text-align:center;
    }

    header h1{
      margin:0;
      font-size:28px;
    }

    header p{
      margin:8px 0 0;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .box{
      background:white;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    input,
    textarea{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      margin:8px 0;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }

    button{
      border:0;
      padding:12px 18px;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      margin-top:8px;
      background:#0b8f55;
      color:white;
    }

    .product{
      background:white;
      padding:18px;
      margin-bottom:15px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .product h3{
      margin-top:0;
    }

    .price{
      font-size:20px;
      font-weight:bold;
      color:#0b8f55;
    }

    #search{
      margin-bottom:15px;
    }

    .loading{
      text-align:center;
      padding:20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ Mera Bazaar</h1>
  <p>Buy & Sell Easily</p>
</header>

<div class="container">

  <div class="box">
    <h2>📦 Add Your Product</h2>

    <input
      type="text"
      id="name"
      placeholder="Product name"
    >

    <input
      type="number"
      id="price"
      placeholder="Price"
    >

    <textarea
      id="description"
      placeholder="Product description"
      rows="4"
    ></textarea>

    <button onclick="addProduct()">
      ➕ Add Product
    </button>
  </div>


  <div class="box">
    <h2>🔎 Search Products</h2>

    <input
      type="text"
      id="search"
      placeholder="Search product..."
      oninput="searchProducts()"
    >
  </div>


  <div class="box">
    <h2>🛍️ Products</h2>

    <div id="products">
      <p class="loading">Products loading...</p>
    </div>
  </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://cifujepkzyfvsldkuxnc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QM9r1UaLnv1zKFUtBUpjxA_OLYSM49j";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let products = [];


/* =========================
   LOAD PRODUCTS
========================= */

async function displayProducts(list = null){

  const box =
    document.getElementById("products");

  box.innerHTML =
    '<p class="loading">Products loading...</p>';

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending:false
      });

  if(error){

    console.error(error);

    box.innerHTML =
      "<p>Products load nahi ho sake.</p>";

    return;
  }

  products = data || [];

  const showProducts =
    list === null ? products : list;

  box.innerHTML = "";

  if(showProducts.length === 0){

    box.innerHTML =
      "<p>No products available yet.</p>";

    return;
  }


  showProducts.forEach(function(p){

    const product =
      document.createElement("div");

    product.className = "product";

    product.innerHTML = `

      <h3>${escapeHtml(p.product_name)}</h3>

      <p class="price">
        Rs ${escapeHtml(String(p.price))}
      </p>

      <p>
        ${escapeHtml(p.description || "")}
      </p>

      <button>
        📱 Contact Seller
      </button>

    `;

    product
      .querySelector("button")
      .addEventListener(
        "click",
        function(){
          contactSeller(p.product_name);
        }
      );

    box.appendChild(product);

  });

}


/* =========================
   ADD PRODUCT
========================= */

async function addProduct(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const price =
    document
      .getElementById("price")
      .value
      .trim();

  const description =
    document
      .getElementById("description")
      .value
      .trim();


  if(!name || !price){

    alert(
      "Product name aur price zaroor likhein."
    );

    return;
  }


  /* Find existing shop */

  const {
    data: shops,
    error: shopError
  } =
    await supabaseClient
      .from("shops")
      .select("id")
      .limit(1);


  if(shopError){

    alert(
      "Shop error: " +
      shopError.message
    );

    console.error(shopError);

    return;
  }


  let shopId;


  /* Create first shop if none exists */

  if(!shops || shops.length === 0){

    const {
      data: newShop,
      error: newShopError
    } =
      await supabaseClient
        .from("shops")
        .insert([{

          shop_name:
            "Mera Bazaar Seller",

          seller_name:
            "Seller",

          whatsapp:
            "923162594812"

        }])
        .select()
        .single();


    if(newShopError){

      alert(
        "Shop create error: " +
        newShopError.message
      );

      console.error(newShopError);

      return;
    }


    shopId = newShop.id;

  }else{

    shopId = shops[0].id;

  }


  /* Add product */

  const {
    error: productError
  } =
    await supabaseClient
      .from("products")
      .insert([{

        shop_id:shopId,

        product_name:name,

        price:Number(price),

        description:description

      }]);


  if(productError){

    alert(
      "Product error: " +
      productError.message
    );

    console.error(productError);

    return;
  }


  /* Clear fields */

  document
    .getElementById("name")
    .value = "";

  document
    .getElementById("price")
    .value = "";

  document
    .getElementById("description")
    .value = "";


  alert(
    "Product successfully add ho gaya! 🎉"
  );


  displayProducts();

}


/* =========================
   SEARCH
========================= */

function searchProducts(){

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if(!q){

    displayProducts();

    return;
  }


  const result =
    products.filter(function(p){

      return (
        (p.product_name || "")
          .toLowerCase()
          .includes(q)
      );

    });


  displayProducts(result);

}


/* =========================
   WHATSAPP
========================= */

function contactSeller(product){

  const number =
    "923162594812";


  const message =
    encodeURIComponent(
      "Assalam o Alaikum, mujhe Mera Bazar par " +
      product +
      " lena hai."
    );


  window.open(
    "https://wa.me/" +
    number +
    "?text=" +
    message,
    "_blank"
  );

}


/* =========================
   SECURITY / DISPLAY
========================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================
   START
========================= */

displayProducts();

</script>

</body>
</html>
